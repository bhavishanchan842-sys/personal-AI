version: '3.8'

services:
  aegis-ai:
    build: .
    container_name: aegis-personal-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-groq}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-openai/gpt-oss-120b}
      - DATABASE_PATH=/app/data/personal_ai.db
    volumes:
      - aegis_data:/app/data

volumes:
  aegis_data:
    driver: local
