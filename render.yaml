services:
  - type: web
    name: aegis-personal-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEFAULT_PROVIDER
        value: groq
      - key: DEFAULT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: aegis-data
      mountPath: /app/data
      sizeGB: 1
